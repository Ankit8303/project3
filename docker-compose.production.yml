name: tomato-production

services:
  auth:
    image: ${IMAGE_NAMESPACE}/auth:${IMAGE_TAG}
    env_file: [.env.production]
    environment: { PORT: 5000, NODE_ENV: production }
    ports: ["127.0.0.1:5000:5000"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.50
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 6, start_period: 10s }

  restaurant:
    image: ${IMAGE_NAMESPACE}/restaurant:${IMAGE_TAG}
    env_file: [.env.production]
    environment: { PORT: 5001, NODE_ENV: production }
    ports: ["127.0.0.1:5001:5001"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.00
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 6, start_period: 10s }

