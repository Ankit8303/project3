    mem_limit: 512m
    cpus: 1.00
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5005/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 6, start_period: 10s }

