# Host-level Nginx reverse proxy. TLS certificates are managed by the host/certbot.
# Internal service ports remain bound to 127.0.0.1 by Docker Compose.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream tomato_auth { server 127.0.0.1:5000; }
upstream tomato_restaurant { server 127.0.0.1:5001; }
upstream tomato_utils { server 127.0.0.1:5002; }
upstream tomato_realtime { server 127.0.0.1:5004; }
upstream tomato_rider { server 127.0.0.1:5005; }
upstream tomato_admin { server 127.0.0.1:5006; }

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    # Replace these with certbot-managed paths for the real hostname.
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location /api/auth/ { proxy_pass http://tomato_auth; include /etc/nginx/proxy_params; }
    location /api/restaurant/ { proxy_pass http://tomato_restaurant; include /etc/nginx/proxy_params; }
    location /api/item/ { proxy_pass http://tomato_restaurant; include /etc/nginx/proxy_params; }
    location /api/cart/ { proxy_pass http://tomato_restaurant; include /etc/nginx/proxy_params; }
    location /api/address/ { proxy_pass http://tomato_restaurant; include /etc/nginx/proxy_params; }
    location /api/order/ { proxy_pass http://tomato_restaurant; include /etc/nginx/proxy_params; }
    location /api/payment/ { proxy_pass http://tomato_utils; include /etc/nginx/proxy_params; }
    location /api/upload { proxy_pass http://tomato_utils; include /etc/nginx/proxy_params; }
    location /api/rider/ { proxy_pass http://tomato_rider; include /etc/nginx/proxy_params; }
    location /api/v1/ { proxy_pass http://tomato_admin; include /etc/nginx/proxy_params; }

    location /socket.io/ {
        proxy_pass http://tomato_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/auth { proxy_pass http://tomato_auth/health; include /etc/nginx/proxy_params; }
    location = /health/restaurant { proxy_pass http://tomato_restaurant/health; include /etc/nginx/proxy_params; }
    location = /health/utils { proxy_pass http://tomato_utils/health; include /etc/nginx/proxy_params; }
    location = /health/realtime { proxy_pass http://tomato_realtime/health; include /etc/nginx/proxy_params; }
    location = /health/rider { proxy_pass http://tomato_rider/health; include /etc/nginx/proxy_params; }
    location = /health/admin { proxy_pass http://tomato_admin/health; include /etc/nginx/proxy_params; }

    location / { return 404; }
}
